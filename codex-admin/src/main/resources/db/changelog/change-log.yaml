databaseChangeLog:
  - property:
      name: now
      value: current_timestamp
      dbms: postgresql
  - property:
      name: now
      value: now()
      dbms: h2,mysql
  - property:
      name: now
      value: sysdate
      dbms: oracle
  - property:
      name: autoIncrement
      value: ture
      dbms: mysql,h2,postgresql,oracle
  - changeSet:
      id: init
      author: wei.guo
      runOnChange: true
      changes:
        - sqlFile:
            path: db/changelog/sql/init.sql